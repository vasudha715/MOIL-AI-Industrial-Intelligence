<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINEWISE AI — Access Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="mine-card p-4 text-center" style="max-width: 420px; width: 100%;">
    <i class="bi bi-hammer text-warning display-5 mb-2"></i>
    <h4 class="fw-bold text-white mb-1">MINEWISE AI</h4>
    <p class="text-muted small mb-4">MOIL Mining Intelligence Platform</p>

    <!-- Tab navigation: Sign In vs Register -->
    <ul class="nav nav-pills nav-fill mb-3 bg-dark rounded p-1 border border-secondary" id="authTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active py-1 text-light small" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel">Sign In</button>
      </li>
      <li class="nav-item">
        <button class="nav-link py-1 text-light small" id="reg-tab" data-bs-toggle="tab" data-bs-target="#reg-panel">Register</button>
      </li>
    </ul>

    <div class="tab-content text-start" id="authTabContent">
      <!-- Login Panel -->
      <div class="tab-pane fade show active" id="login-panel">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small text-muted">Official Email</label>
            <input type="email" id="loginEmail" class="form-control bg-dark text-white border-secondary" placeholder="officer@moil.nic.in" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Password</label>
            <input type="password" id="loginPassword" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold text-dark py-2">Sign In</button>
        </form>
      </div>

      <!-- Register Panel -->
      <div class="tab-pane fade" id="reg-panel">
        <form id="registerForm">
          <div class="mb-2">
            <label class="form-label small text-muted">Full Name</label>
            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="P. V. Ganesh" required>
          </div>
          <div class="mb-2">
            <label class="form-label small text-muted">Department / Division</label>
            <select class="form-select bg-dark text-white border-secondary">
              <option>Geological Survey & Exploration</option>
              <option>Mine Operations & Planning</option>
              <option>Executive Management</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Official Email</label>
            <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="name@moil.nic.in" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold text-dark py-2">Request Access</button>
        </form>
      </div>
    </div>

    <!-- 1-Click Judge Access -->
    <div class="border-top border-secondary pt-3 mt-4">
     <button
  type="button"
  onclick="demoLogin()"
  class="btn btn-outline-warning btn-sm w-100"
>

  <i class="bi bi-patch-check me-1"></i>

  Quick Demo Access
  (Judges / Reviewers)

</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>
</body>
</html>
